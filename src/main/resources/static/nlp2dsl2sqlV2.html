<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP2DSL2SQL 数据分析助手-agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f7f7f8;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #e5e5e5;
            padding: 14px 20px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .mode-switch {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 4px;
            background: #f3f4f6;
            border-radius: 10px;
            padding: 3px;
            margin-left: 0;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { flex-direction: row-reverse; }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
            color: #fff;
        }

        .message.user .avatar { background: #4f46e5; }
        .message.ai .avatar { background: #16a34a; }

        .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.7;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
            max-width: calc(100% - 50px);
        }

        .message.user .bubble {
            background: #4f46e5;
            color: #fff;
            border-bottom-right-radius: 6px;
        }

        .message.ai .bubble {
            background: #fff;
            color: #333;
            border: 1px solid #e5e5e5;
            border-bottom-left-radius: 6px;
            white-space: normal;
        }

        .answer-section {
            margin-bottom: 14px;
        }

        .answer-section:last-child {
            margin-bottom: 0;
        }

        .answer-label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
        }

        .answer-intent {
            display: inline-block;
            background: #eef2ff;
            color: #4338ca;
            border-radius: 999px;
            padding: 2px 10px;
            font-size: 13px;
            font-weight: 600;
        }

        .answer-sql {
            margin: 0;
            padding: 10px 12px;
            background: #f3f4f6;
            border-radius: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            color: #111827;
            overflow-x: auto;
        }

        .answer-conclusion {
            color: #1f2937;
            line-height: 1.75;
            white-space: pre-wrap;
        }

        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-indicator span {
            width: 7px;
            height: 7px;
            background: #999;
            border-radius: 50%;
            animation: blink 1.4s infinite both;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }

        .error-text { color: #dc2626; white-space: pre-wrap; }

        .input-area {
            background: #fff;
            border-top: 1px solid #e5e5e5;
            padding: 16px;
        }

        .input-wrapper {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            resize: none;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 15px;
            font-family: inherit;
            line-height: 1.5;
            min-height: 46px;
            max-height: 160px;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus { border-color: #4f46e5; }

        button#sendBtn {
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 12px;
            background: #4f46e5;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }

        button#sendBtn:hover { background: #4338ca; }
        button#sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }

        .welcome {
            text-align: center;
            color: #999;
            margin: auto;
            font-size: 15px;
            line-height: 1.8;
        }

        .welcome h2 { color: #555; font-size: 20px; margin-bottom: 8px; }

        .mode-btn {
            border: none;
            background: transparent;
            color: #6b7280;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: #4f46e5;
            color: #fff;
        }

        .mode-btn:not(.active):hover {
            background: #e5e7eb;
        }

        .sql-confirm-panel {
            margin-top: 12px;
            padding: 12px;
            border: 1px solid #f59e0b;
            background: #fffbeb;
            border-radius: 10px;
        }

        .sql-confirm-panel .sql-confirm-title {
            font-weight: 600;
            color: #92400e;
            margin-bottom: 8px;
        }

        .sql-confirm-panel pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
            white-space: pre-wrap;
            margin-bottom: 8px;
        }

        .sql-confirm-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .sql-confirm-row input {
            flex: 1;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 14px;
        }

        .sql-confirm-row button {
            border: none;
            background: #d97706;
            color: #fff;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            font-weight: 600;
        }

        .trace-btn {
            border: 1px solid #e5e5e5;
            background: #fff;
            color: #4f46e5;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .trace-btn:hover { background: #eef2ff; }

        .trace-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 380px;
            max-width: 90vw;
            background: #fff;
            border-left: 1px solid #e5e5e5;
            box-shadow: -4px 0 16px rgba(0, 0, 0, 0.08);
            transform: translateX(100%);
            transition: transform 0.25s ease;
            z-index: 50;
            display: flex;
            flex-direction: column;
        }

        .trace-panel.open { transform: translateX(0); }

        .trace-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid #e5e5e5;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        .trace-panel-head .trace-close {
            border: none;
            background: transparent;
            color: #6b7280;
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
        }

        .trace-body { flex: 1; overflow-y: auto; padding: 12px 16px; }

        .trace-list { display: flex; flex-direction: column; gap: 8px; }

        .trace-item {
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .trace-item:hover { background: #f9fafb; }

        .trace-item-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .trace-status {
            font-size: 11px;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 999px;
        }

        .trace-status.COMPLETED { background: #dcfce7; color: #166534; }
        .trace-status.RUNNING { background: #dbeafe; color: #1e40af; }
        .trace-status.FAILED { background: #fee2e2; color: #991b1b; }
        .trace-status.CANCELLED { background: #f3f4f6; color: #6b7280; }
        .trace-status.SUCCESS { background: #dcfce7; color: #166534; }
        .trace-status.ERROR { background: #fee2e2; color: #991b1b; }
        .trace-status.DENIED { background: #fef3c7; color: #92400e; }
        .trace-status.INTERRUPTED { background: #f3f4f6; color: #6b7280; }

        .trace-layer {
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            margin-right: 4px;
            vertical-align: 1px;
        }
        .trace-layer-host { background: #ede9fe; color: #5b21b6; }
        .trace-layer-sql { background: #e0f2fe; color: #075985; }

        .trace-model {
            font-size: 12px;
            color: #4f46e5;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .trace-time { font-size: 11px; color: #9ca3af; flex-shrink: 0; }

        .trace-question {
            font-size: 13px;
            color: #111827;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .trace-meta {
            font-size: 11px;
            color: #6b7280;
            line-height: 1.6;
        }

        .trace-empty {
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            padding: 24px 0;
        }

        .trace-detail-head {
            margin-bottom: 12px;
            font-size: 14px;
            color: #111827;
            font-weight: 600;
            word-break: break-word;
        }

        .trace-label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            letter-spacing: 0.04em;
            margin: 12px 0 6px;
        }

        .trace-steps {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .trace-step {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 13px;
            padding: 6px 10px;
            background: #f9fafb;
            border-radius: 8px;
        }

        .trace-step-name {
            font-weight: 600;
            color: #111827;
            flex-shrink: 0;
        }

        .trace-step-detail {
            color: #374151;
            flex: 1;
            word-break: break-word;
        }

        .trace-step-time {
            color: #9ca3af;
            font-size: 11px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<header>
    NLP2DSL2SQL 数据分析助手
    <div class="mode-switch">
        <button class="mode-btn active" id="modeWorkflow"
                onclick="switchMode('workflow')">V2 Workflow</button>
        <button class="mode-btn" id="modeAgent"
                onclick="switchMode('multiAgent')">agent-tools-ReAct</button>
        <button class="mode-btn" id="modePlanner"
                onclick="switchMode('plannerWorkflow')">Planner-Workflow</button>
        <button class="mode-btn" id="modeSkill"
                onclick="switchMode('agentSkillWorkflow')">Agent-Skill-Workflow</button>
        <button class="mode-btn" id="modeA2aHost"
                onclick="switchMode('a2aHost')">A2A Host</button>
    </div>
    <button class="trace-btn" id="traceToggleBtn" onclick="toggleTracePanel()">
        Trace
    </button>
</header>

<div class="trace-panel" id="tracePanel">
    <div class="trace-panel-head">
        <span>A2A Host 模型路由 Trace</span>
        <button class="trace-close" onclick="toggleTracePanel()"
                title="关闭">&times;</button>
    </div>
    <div class="trace-body">
        <div id="traceList" class="trace-list"></div>
        <div id="traceDetail" class="trace-detail"></div>
    </div>
</div>

<div class="chat-container" id="chatContainer">
    <div class="welcome">
        <h2>你好，我是数据分析助手</h2>
        <div>输入问题，我将查询数据库并为你分析回答</div>
    </div>
</div>

<div class="input-area">
    <div class="input-wrapper">
        <textarea id="userInput" rows="1" placeholder="输入你的问题..." autofocus></textarea>
        <button id="sendBtn" title="发送">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
    </div>
</div>

<script>
    // 智能适配后端地址：
    // 1. 如果当前页面就在 8079 端口（Spring Boot 托管），走当前同源 origin；
    // 2. 如果是从 IDEA 内置预览（63342）、其他前端端口或本地文件 file:// 打开，固定指向当前 host 的 8079 端口。
    const BACKEND_PORT = 8079;
    const API_BASE = (() => {
        if (typeof window === 'undefined' || !window.location) return `http://localhost:${BACKEND_PORT}`;
        const loc = window.location;
        if (loc.protocol && loc.protocol.startsWith('http')) {
            if (String(loc.port) === String(BACKEND_PORT)) {
                return loc.origin;
            }
            const host = loc.hostname || 'localhost';
            return `http://${host}:${BACKEND_PORT}`;
        }
        return `http://localhost:${BACKEND_PORT}`;
    })();
    const API_BASE_URL = API_BASE.replace(/\/+$/, '');
    // 网关钥匙：localStorage.AI_API_KEY，与后端 ai.api-key 对应。
    // 本地开发默认兜底 'local-dev-123'（与 application-local.yaml 一致）；
    // 生产可通过控制台 localStorage.setItem('AI_API_KEY','<key>') 覆盖。
    const AI_API_KEY = (() => {
        try {
            return localStorage.getItem('AI_API_KEY') || 'local-dev-123';
        } catch (e) {
            return 'local-dev-123';
        }
    })();
    function apiHeaders(extra) { return Object.assign({}, extra || {}, AI_API_KEY ? { 'X-API-KEY': AI_API_KEY } : {}); }
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    let isStreaming = false;
    let currentMode = 'workflow';
    /**
     * 会话 ID 落 localStorage：刷新页面、切模式都不换新会话，
     * 否则后端 24h 的会话语义快照会直接变孤儿（多轮追问全部失忆）。
     * 5 个模式共用同一个 key —— 它们的 DSL 产物是模式无关的。
     */
    const SESSION_ID_KEY = 'nlp2dsl2sql.sessionId';
    let sessionId = loadOrCreateSessionId();
    let awaitingSqlConfirm = false;
    let sqlConfirmPanelShownFor = '';
    /** 本轮最新待审批是否已提交（批准或拒绝），防止 SSE 续写再次弹出表单 */
    let sqlConfirmResolved = false;
    /** 当前待审批的确认 ID（来自卡片 confirmId，提交确认时回传精确匹配） */
    let sqlConfirmId = null;
    /** 当前 A2A Host 流式全文，供确认后清洗展示 */
    let a2aFullText = '';

    function loadOrCreateSessionId() {
        let sid = null;
        try {
            sid = localStorage.getItem(SESSION_ID_KEY);
        } catch (e) {
            // 隐私模式等场景 localStorage 不可用，退化为仅内存会话
        }
        if (!sid) {
            sid = newSessionId();
            try {
                localStorage.setItem(SESSION_ID_KEY, sid);
            } catch (e) {
                // 忽略：无持久化能力时仅本次页面有效
            }
        }
        return sid;
    }

    function newSessionId() {
        if (window.crypto && crypto.randomUUID) {
            return crypto.randomUUID();
        }
        return 'sid-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    }

    /**
     * 当前 A2A Host 路由到的模型名（SSE 首部解析）。
     */
    let a2aModelName = '';
    /**
     * 当前 A2A Host 复杂度档位（SSE 首部解析）。
     */
    let a2aTier = '';

    /**
     * 开合 Trace 面板。
     */
    function toggleTracePanel() {
        const panel = document.getElementById('tracePanel');
        const open = panel.classList.toggle('open');
        if (open) {
            loadTraceList();
        }
    }

    /**
     * 加载最近 trace 列表并渲染。
     */
    async function loadTraceList() {
        const box = document.getElementById('traceList');
        const detail = document.getElementById('traceDetail');
        detail.innerHTML = '';
        try {
            const resp = await fetch(`${API_BASE_URL}/aiChat/a2aHost/traces`, { headers: apiHeaders() });
            const list = await resp.json();
            if (!Array.isArray(list) || list.length === 0) {
                box.innerHTML = '<div class="trace-empty">暂无 trace 记录</div>';
                return;
            }
            box.innerHTML = list.map(renderTraceItem).join('');
        } catch (e) {
            box.innerHTML = '<div class="trace-empty">加载失败: '
                    + escapeHtml(e.message) + '</div>';
        }
    }

    /**
     * 渲染单条 trace 列表项（点击加载详情）。
     */
    function renderTraceItem(t) {
        const d = new Date(t.startTimeMs);
        const time = d.toLocaleTimeString();
        const hitl = t.hitlApproved == null ? '' :
                ' · HITL=' + (t.hitlApproved ? '批准' : '拒绝');
        return '<div class="trace-item" onclick="loadTraceDetail('
                + `'${encodeURIComponent(t.sessionId)}')" title="点击查看详情">`
                + '<div class="trace-item-head">'
                + `<span class="trace-status ${escapeHtml(t.status)}">${escapeHtml(t.status)}</span>`
                + `<span class="trace-model">${escapeHtml(t.modelName || '')}</span>`
                + `<span class="trace-time">${time}</span>`
                + '</div>'
                + `<div class="trace-question">${escapeHtml(t.question || '')}</div>`
                + '<div class="trace-meta">tier='
                + `${escapeHtml(t.tier || '')} · ${formatDuration(t.durationMs)}${hitl}</div>`
                + '</div>';
    }

    /**
     * 加载单条 trace 详情并渲染。
     */
    async function loadTraceDetail(encodedSessionId) {
        const sessionId = decodeURIComponent(encodedSessionId);
        const box = document.getElementById('traceDetail');
        try {
            const resp = await fetch(
                    `${API_BASE_URL}/aiChat/a2aHost/traces/${encodedSessionId}`, { headers: apiHeaders() });
            const t = await resp.json();
            if (!t || !t.sessionId) {
                box.innerHTML = '<div class="trace-empty">未找到该 trace</div>';
                return;
            }
            box.innerHTML = renderTraceDetail(t);
        } catch (e) {
            box.innerHTML = '<div class="trace-empty">加载失败: '
                    + escapeHtml(e.message) + '</div>';
        }
    }

    /**
     * 渲染 trace 详情。
     */
    function renderTraceDetail(t) {
        const d = new Date(t.startTimeMs);
        const hitl = t.hitlApproved == null ? '' :
                ' · HITL=' + (t.hitlApproved ? '已批准' : '已拒绝');
        const steps = (t.steps || []).map(s => {
            const rel = Math.max(0, s.timeMs - t.startTimeMs);
            return '<div class="trace-step">'
                    + `<span class="trace-step-name">${escapeHtml(s.name)}</span>`
                    + `<span class="trace-step-detail">${escapeHtml(s.detail || '')}</span>`
                    + `<span class="trace-step-time">+${(rel / 1000).toFixed(1)}s</span>`
                    + '</div>';
        }).join('');
        const tools = (t.toolCalls || []).map(tc => {
            const rel = Math.max(0, tc.startTimeMs - t.startTimeMs);
            const layerBadge = tc.layer === 'host'
                    ? '<span class="trace-layer trace-layer-host">HOST</span>'
                    : '<span class="trace-layer trace-layer-sql">SQL</span>';
            return '<div class="trace-step">'
                    + `<span class="trace-step-name">${layerBadge} ${escapeHtml(tc.name)}</span>`
                    + `<span class="trace-status ${escapeHtml(tc.state)}">${escapeHtml(tc.state)}</span>`
                    + `<span class="trace-step-detail">${formatDuration(tc.durationMs)}</span>`
                    + `<span class="trace-step-time">+${(rel / 1000).toFixed(1)}s</span>`
                    + '</div>';
        }).join('');
        const llms = (t.llmCalls || []).map(lc => {
            const rel = Math.max(0, lc.startTimeMs - t.startTimeMs);
            const layerBadge = lc.layer === 'host'
                    ? '<span class="trace-layer trace-layer-host">HOST</span>'
                    : '<span class="trace-layer trace-layer-sql">SQL</span>';
            const tokens = lc.totalTokens == null ? ''
                    : `<span class="trace-step-detail">${lc.inputTokens == null ? '-' : lc.inputTokens}`
                    + `→${lc.outputTokens == null ? '-' : lc.outputTokens} tokens</span>`;
            return '<div class="trace-step">'
                    + `<span class="trace-step-name">${layerBadge} LLM 调用</span>`
                    + tokens
                    + `<span class="trace-step-detail">${formatDuration(lc.durationMs)}</span>`
                    + `<span class="trace-step-time">+${(rel / 1000).toFixed(1)}s</span>`
                    + '</div>';
        }).join('');
        return '<div class="trace-detail-head">'
                + `<div>${escapeHtml(t.question || '')}</div>`
                + '<div class="trace-meta">'
                + `sessionId: ${escapeHtml(t.sessionId)}</div>`
                + '<div class="trace-meta">tier='
                + `${escapeHtml(t.tier || '')} · model=${escapeHtml(t.modelName || '')}`
                + ` · ${escapeHtml(t.status)} · ${formatDuration(t.durationMs)}`
                + ` · ${d.toLocaleString()}${hitl}</div>`
                + '</div>'
                + (t.error ? `<div class="trace-label">错误</div><div class="error-text">${escapeHtml(t.error)}</div>` : '')
                + (t.sql ? `<div class="trace-label">SQL</div><pre class="answer-sql">${escapeHtml(t.sql)}</pre>` : '')
                + (llms ? `<div class="trace-label">LLM 调用</div><div class="trace-steps">${llms}</div>` : '')
                + (tools ? `<div class="trace-label">工具调用</div><div class="trace-steps">${tools}</div>` : '')
                + (steps ? `<div class="trace-label">步骤时间线</div><div class="trace-steps">${steps}</div>` : '')
                + `<div class="trace-label">JSONL 落盘</div><div class="trace-meta">.agentscope/traces/a2a-host.jsonl</div>`;
    }

    /**
     * 毫秒转可读时长。
     */
    function formatDuration(ms) {
        if (ms == null) {
            return '-';
        }
        if (ms < 1000) {
            return ms + 'ms';
        }
        return (ms / 1000).toFixed(1) + 's';
    }

    /**
     * 重置本轮 HITL 确认状态。
     */
    function resetSqlConfirmState() {
        awaitingSqlConfirm = false;
        sqlConfirmPanelShownFor = '';
        sqlConfirmResolved = false;
        a2aFullText = '';
        userInput.placeholder = '输入你的问题...';
    }

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('modeWorkflow').classList.toggle(
                'active', mode === 'workflow');
        document.getElementById('modeAgent').classList.toggle(
                'active', mode === 'multiAgent');
        document.getElementById('modePlanner').classList.toggle(
                'active', mode === 'plannerWorkflow');
        document.getElementById('modeSkill').classList.toggle(
                'active', mode === 'agentSkillWorkflow');
        document.getElementById('modeA2aHost').classList.toggle(
                'active', mode === 'a2aHost');
        if (mode === 'a2aHost') {
            a2aModelName = '';
            a2aTier = '';
            resetSqlConfirmState();
        }
        userInput.focus();
    }

    /**
     * 按当前模式返回对应后端 SSE 接口，统一带上 sessionId。
     * 五个模式共用一个会话，切模式不清记忆。
     */
    function getApiEndpoint() {
        const sid = `?sessionId=${encodeURIComponent(sessionId)}`;
        if (currentMode === 'multiAgent') {
            return `${API_BASE_URL}/aiChat/nlp2Dsl2SqlAgent${sid}`;
        }
        if (currentMode === 'plannerWorkflow') {
            return `${API_BASE_URL}/aiChat/nlp2Dsl2SqlPlannerWorkflow${sid}`;
        }
        if (currentMode === 'agentSkillWorkflow') {
            return `${API_BASE_URL}/aiChat/nlp2Dsl2SqlAgentSkillWorkflow${sid}`;
        }
        if (currentMode === 'a2aHost') {
            return `${API_BASE_URL}/aiChat/a2aHost${sid}`;
        }
        return `${API_BASE_URL}/aiChat/nlp2Dsl2SqlAgentV2${sid}`;
    }

    /**
     * 从 HITL 标记文本中解析待确认 SQL。
     */
    function parsePendingSql(text) {
        const mark = '[SQL确认待审批]';
        const idx = text.lastIndexOf(mark);
        if (idx < 0) {
            return null;
        }
        const slice = text.slice(idx);
        const sqlMatch = slice.match(/sql:\n([\s\S]*?)\n==========/);
        return sqlMatch ? sqlMatch[1].trim() : '';
    }

    /**
     * 从 HITL 标记文本中解析最新待审批的 confirmId。
     */
    function parseConfirmId(text) {
        const mark = '[SQL确认待审批]';
        const idx = text.lastIndexOf(mark);
        if (idx < 0) {
            return null;
        }
        const slice = text.slice(idx);
        const idMatch = slice.match(/confirmId: ([^\n]+)/);
        return idMatch ? idMatch[1].trim() : null;
    }

    /**
     * 最新待审批之后是否已有确认结果（批准/拒绝/超时）。
     */
    function hasConfirmResultAfterLatestPending(fullText) {
        const pendingIdx = fullText.lastIndexOf('[SQL确认待审批]');
        if (pendingIdx < 0) {
            return false;
        }
        const resultIdx = fullText.lastIndexOf('[SQL确认结果]');
        return resultIdx > pendingIdx;
    }

    /**
     * 将确认面板收成结果态，不再展示输入框；并清洗待审批原文。
     */
    function settleSqlConfirmPanel(bubble, message) {
        awaitingSqlConfirm = false;
        sqlConfirmResolved = true;
        sqlConfirmId = null;
        userInput.placeholder = '输入你的问题...';
        let panel = bubble.querySelector('.sql-confirm-panel');
        const display = stripPendingConfirmBlock(
                a2aFullText || bubble.textContent || '');
        bubble.textContent = display;
        if (!panel) {
            panel = document.createElement('div');
            panel.className = 'sql-confirm-panel';
        }
        panel.innerHTML = '<div class="sql-confirm-title">'
                + escapeHtml(message || '已提交')
                + '</div>';
        bubble.appendChild(panel);
    }

    /**
     * 根据 SSE 全文中的确认结果推导面板文案。
     */
    function resolveConfirmPanelMessage(fullText) {
        const resultIdx = fullText.lastIndexOf('[SQL确认结果]');
        if (resultIdx < 0) {
            return '已提交';
        }
        const slice = fullText.slice(resultIdx, resultIdx + 120);
        if (slice.includes('approved=true')) {
            return '已批准执行';
        }
        return '已取消执行';
    }

    /**
     * 刷新气泡正文并保留确认面板节点。
     * 已决策时隐藏待审批交互原文，避免再次出现「请确认」文案。
     */
    function refreshA2aBubbleText(bubble, fullText) {
        const panelHtml = bubble.querySelector('.sql-confirm-panel');
        bubble.style.whiteSpace = 'pre-wrap';
        let display = fullText || '(无响应内容)';
        if (sqlConfirmResolved || hasConfirmResultAfterLatestPending(fullText)) {
            display = stripPendingConfirmBlock(display);
        }
        bubble.textContent = display;
        if (panelHtml) {
            bubble.appendChild(panelHtml);
        }
    }

    /**
     * 去掉已处理的「SQL确认待审批」块，避免拒绝后正文里仍像在索要确认。
     */
    function stripPendingConfirmBlock(text) {
        if (!text) {
            return text;
        }
        return text.replace(
                /\n*\n========== \[SQL确认待审批\] ==========[\s\S]*?========== \[请输入 yes 或 确认\] ==========(\n\n)?/g,
                '\n\n');
    }

    /**
     * 展示 SQL 确认面板（同一段待审批只展示一次；已决策后不再弹出）。
     */
    function ensureSqlConfirmPanel(bubble, fullText) {
        const mark = '[SQL确认待审批]';
        if (!fullText.includes(mark)) {
            return;
        }
        const key = String(fullText.lastIndexOf(mark));
        if (hasConfirmResultAfterLatestPending(fullText)) {
            settleSqlConfirmPanel(
                    bubble, resolveConfirmPanelMessage(fullText));
            return;
        }
        if (sqlConfirmResolved && sqlConfirmPanelShownFor === key) {
            return;
        }
        if (sqlConfirmPanelShownFor === key
                && bubble.querySelector('.sql-confirm-panel')) {
            return;
        }
        sqlConfirmPanelShownFor = key;
        sqlConfirmResolved = false;
        awaitingSqlConfirm = true;
        sqlConfirmId = parseConfirmId(fullText);
        userInput.placeholder = '输入 yes 或 确认';
        let panel = bubble.querySelector('.sql-confirm-panel');
        if (!panel) {
            panel = document.createElement('div');
            panel.className = 'sql-confirm-panel';
            bubble.appendChild(panel);
        }
        const sql = parsePendingSql(fullText) || '(解析中...)';
        panel.innerHTML =
                '<div class="sql-confirm-title">请确认 SQL 无误后输入 yes 或 确认</div>'
                + '<pre>' + escapeHtml(sql) + '</pre>'
                + '<div class="sql-confirm-row">'
                + '<input id="sqlConfirmInput" type="text" '
                + 'placeholder="yes / 确认" />'
                + '<button type="button" id="sqlConfirmBtn">提交确认</button>'
                + '</div>';
        const input = panel.querySelector('#sqlConfirmInput');
        const btn = panel.querySelector('#sqlConfirmBtn');
        const submit = () => submitSqlConfirm(input.value);
        btn.onclick = submit;
        input.onkeydown = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                submit();
            }
        };
        input.focus();
        scrollToBottom();
    }

    /**
     * 提交 SQL 确认（服务端以 rawInput 判定）。
     */
    async function submitSqlConfirm(rawInput) {
        if (!awaitingSqlConfirm || !sessionId) {
            return;
        }
        const text = (rawInput || '').trim();
        if (!text) {
            return;
        }
        try {
            const resp = await fetch(
                    `${API_BASE_URL}/aiChat/a2aHost/confirm`, {
                        method: 'POST',
                        headers: apiHeaders({ 'Content-Type': 'application/json' }),
                        body: JSON.stringify({
                            sessionId: sessionId,
                            confirmId: sqlConfirmId,
                            approved: null,
                            rawInput: text
                        })
                    });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok || data.ok === false) {
                alert(data.message || ('确认失败: ' + resp.status));
                return;
            }
            const bubble = document.querySelector(
                    '.message.ai:last-of-type .bubble');
            if (bubble) {
                settleSqlConfirmPanel(
                        bubble, data.message || '已提交');
            } else {
                awaitingSqlConfirm = false;
                sqlConfirmResolved = true;
                userInput.placeholder = '输入你的问题...';
            }
        } catch (e) {
            alert('确认请求失败: ' + e.message);
        }
    }

    if (API_BASE) {
        const tip = document.createElement('div');
        tip.style.cssText = 'text-align:center;font-size:12px;color:#999;padding:4px;background:#fff3cd;border-bottom:1px solid #ffc107;';
        tip.textContent = `后端地址: ${API_BASE_URL}`;
        document.body.prepend(tip);
    }

    function removeWelcome() {
        const w = chatContainer.querySelector('.welcome');
        if (w) w.remove();
    }

    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function parseAnswerSections(text) {
        const result = { intent: '', sql: '', conclusion: '', raw: text };
        if (!text) {
            return result;
        }
        const intentMatch = text.match(/意图[:：]\s*([^\n]+)/);
        if (intentMatch) {
            result.intent = intentMatch[1].trim();
        }
        const sqlMatch = text.match(/SQL[:：]\s*\n?([\s\S]*?)(?:\n\s*结论[:：]|$)/);
        if (sqlMatch) {
            result.sql = sqlMatch[1].trim();
        }
        const conclusionMatch = text.match(/结论[:：]\s*\n?([\s\S]*)$/);
        if (conclusionMatch) {
            result.conclusion = conclusionMatch[1].trim();
        }
        return result;
    }

    function renderAiBubble(bubble, text) {
        if (!text) {
            bubble.textContent = '思考中...';
            return;
        }
        const sections = parseAnswerSections(text);
        const hasStructure = sections.intent || sections.sql || sections.conclusion;
        if (!hasStructure) {
            bubble.style.whiteSpace = 'pre-wrap';
            bubble.textContent = text;
            return;
        }
        let html = '';
        if (sections.intent) {
            html += `<div class="answer-section"><div class="answer-label">意图</div><span class="answer-intent">${escapeHtml(sections.intent)}</span></div>`;
        }
        if (sections.sql) {
            html += `<div class="answer-section"><div class="answer-label">SQL</div><pre class="answer-sql">${escapeHtml(sections.sql)}</pre></div>`;
        }
        if (sections.conclusion) {
            html += `<div class="answer-section"><div class="answer-label">结论</div><div class="answer-conclusion">${escapeHtml(sections.conclusion)}</div></div>`;
        } else if (!sections.sql && text.includes('结论')) {
            html += `<div class="answer-section"><div class="answer-label">结论</div><div class="answer-conclusion">生成中...</div></div>`;
        }
        bubble.innerHTML = html || escapeHtml(text);
    }

    function addMessage(role, text) {
        removeWelcome();
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.innerHTML = `<div class="avatar">${role === 'user' ? '你' : 'AI'}</div><div class="bubble">${escapeHtml(text)}</div>`;
        chatContainer.appendChild(div);
        scrollToBottom();
        return div.querySelector('.bubble');
    }

    function addStreamingMessage() {
        removeWelcome();
        const div = document.createElement('div');
        div.className = 'message ai';
        div.innerHTML = `<div class="avatar">AI</div><div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
        chatContainer.appendChild(div);
        scrollToBottom();
        return div.querySelector('.bubble');
    }

    function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function extractSseEventData(eventChunk) {
        const dataLines = [];
        for (const line of eventChunk.split('\n')) {
            if (!line.startsWith('data:')) {
                continue;
            }
            let data = line.slice(5);
            if (data.startsWith(' ')) {
                data = data.slice(1);
            }
            if (data === '[DONE]') {
                continue;
            }
            dataLines.push(data);
        }
        return dataLines.join('\n');
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;
        if (awaitingSqlConfirm && currentMode === 'a2aHost') {
            userInput.value = '';
            await submitSqlConfirm(text);
            return;
        }
        if (isStreaming) return;
        isStreaming = true;
        sendBtn.disabled = true;
        userInput.value = '';
        userInput.style.height = 'auto';
        if (currentMode === 'a2aHost') {
            // 同一轮 A2A Host 对话复用同一个 sessionId（已落 localStorage），
            // 保证多轮问题共享会话上下文与落盘的会话记忆文件。
            resetSqlConfirmState();
        }
        addMessage('user', text);
        const bubble = addStreamingMessage();
        let fullText = '';
        a2aFullText = '';
        try {
            const base = getApiEndpoint();
            const sep = base.includes('?') ? '&' : '?';
            const url = `${base}${sep}question=${encodeURIComponent(text)}`;
            const resp = await fetch(url, { headers: apiHeaders() });
            if (!resp.ok) {
                const errText = await resp.text().catch(() => '');
                bubble.innerHTML = `<span class="error-text">请求失败: ${resp.status} ${resp.statusText}\n${escapeHtml(errText)}</span>`;
                isStreaming = false;
                sendBtn.disabled = false;
                return;
            }
            const contentType = resp.headers.get('content-type') || '';
            if (contentType.includes('text/event-stream')) {
                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const chunks = buffer.split('\n\n');
                    buffer = chunks.pop();
                    for (const chunk of chunks) {
                        const piece = extractSseEventData(chunk);
                        if (piece) {
                            fullText += piece;
                            a2aFullText = fullText;
                            const sidMatch = piece.match(
                                    /sessionId:\s*([^\s\n]+)/);
                            if (sidMatch && currentMode === 'a2aHost') {
                                sessionId = sidMatch[1].trim();
                                try {
                                    localStorage.setItem(SESSION_ID_KEY, sessionId);
                                } catch (e) {
                                    // 忽略：无持久化能力时仅本次页面有效
                                }
                            }
                            const modelMatch = piece.match(
                                    /model:\s*([^\s\n]+)/);
                            if (modelMatch && currentMode === 'a2aHost') {
                                a2aModelName = modelMatch[1].trim();
                            }
                            const tierMatch = piece.match(
                                    /tier:\s*([^\s\n]+)/);
                            if (tierMatch && currentMode === 'a2aHost') {
                                a2aTier = tierMatch[1].trim();
                            }
                        }
                    }
                    if (currentMode === 'a2aHost'
                            && fullText.includes('[SQL确认待审批]')) {
                        refreshA2aBubbleText(bubble, fullText);
                        ensureSqlConfirmPanel(bubble, fullText);
                    } else {
                        renderAiBubble(bubble, fullText || '思考中...');
                    }
                    scrollToBottom();
                }
                if (buffer.trim()) {
                    const piece = extractSseEventData(buffer);
                    if (piece) {
                        fullText += piece;
                        a2aFullText = fullText;
                    }
                }
                if (currentMode === 'a2aHost'
                        && fullText.includes('[SQL确认待审批]')) {
                    refreshA2aBubbleText(bubble, fullText);
                    ensureSqlConfirmPanel(bubble, fullText);
                } else {
                    renderAiBubble(bubble, fullText || '(无响应内容)');
                }
            } else {
                fullText = await resp.text();
                renderAiBubble(bubble, fullText || '(无响应内容)');
            }
        } catch (e) {
            console.error('请求错误:', e);
            bubble.innerHTML = `<span class="error-text">连接失败: ${escapeHtml(e.message)}\n\n检查后端是否运行，以及 API_BASE 配置是否正确</span>`;
        } finally {
            isStreaming = false;
            sendBtn.disabled = false;
            userInput.focus();
            if (currentMode === 'a2aHost') {
                refreshCurrentTrace();
            }
        }
    }

    /**
     * 流结束后刷新当前会话 trace 详情（若面板打开）。
     */
    async function refreshCurrentTrace() {
        const panel = document.getElementById('tracePanel');
        if (!panel.classList.contains('open') || !sessionId) {
            return;
        }
        try {
            const encoded = encodeURIComponent(sessionId);
            const resp = await fetch(
                    `${API_BASE_URL}/aiChat/a2aHost/traces/${encoded}`, { headers: apiHeaders() });
            const t = await resp.json();
            const detail = document.getElementById('traceDetail');
            if (t && t.sessionId) {
                detail.innerHTML = renderTraceDetail(t);
            }
            loadTraceList();
        } catch (e) {
            // 静默失败，不影响主流程
        }
    }

    userInput.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 160) + 'px';
    });

    userInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    sendBtn.addEventListener('click', sendMessage);
</script>
