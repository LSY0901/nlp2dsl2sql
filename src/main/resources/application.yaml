server:
  port: 8079

spring:
  application:
    name: Nlp2dsl2sql
  datasource:
    url: jdbc:postgresql://localhost:5432/agent_db?options=-c%20search_path%3Dagent%2Cpublic
    username: agent_user
    password: 123456

agentscope:
  model:
    provider: openai
  openai:
    api-key: sk-XXXX
    base-url: https://api.deepseek.com
    model-name: deepseek-v4-pro
  a2a:
    server:
      enabled: true
      card:
        name: sql-query-agent
        description: 自然语言业务数据查询（NLP→DSL→SQL）

a2a:
  sql-agent:
    base-url: http://127.0.0.1:8079
    agent-card-path: /.well-known/agent-card.json
  sop-agent:
    base-url: http://127.0.0.1:9003
    agent-card-path: /.well-known/agent-card.json
    timeout-ms: 60000

embedding:
  base-url: http://localhost:8082
  model: bge-m3

rerank:
  base-url: http://localhost:8083
  model: bge-reranker-v2-m3

logging:
  level:
    org.example.nlp2dsl2sql: debug

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:/mapper/**/*.xml

dsl:
  translator:
    dialect: postgresql
