server:
  port: 8079

# 敏感项一律走占位符：本地真实值放在 application-local.yaml（已 gitignore，不入库，
# 见 application-local.yaml.example），启动加 --spring.profiles.active=local；
# 生产走环境变量 DB_PASSWORD / LLM_API_KEY。缺 key 启动 fail-fast（见 ModelConfig）。
spring:
  application:
    name: Nlp2dsl2sql
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agent_db?options=-c%20search_path%3Dagent%2Cpublic}
    username: ${DB_USERNAME:agent_user}
    password: ${DB_PASSWORD:}
  data:
    redis:
      # 短期会话记忆（快照 + 轮次流水），容器 nlp2dsl2sql-redis
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

agentscope:
  model:
    provider: openai
  openai:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    model-name: ${LLM_MODEL_NAME:deepseek-flash}
  a2a:
    server:
      enabled: true
      card:
        name: sql-query-agent
        description: 自然语言业务数据查询（NLP→DSL→SQL）

a2a:
  sql-agent:
    base-url: ${A2A_SQL_BASE_URL:http://127.0.0.1:8079}
    agent-card-path: /.well-known/agent-card.json
  sop-agent:
    base-url: ${A2A_SOP_BASE_URL:http://127.0.0.1:9003}
    agent-card-path: /.well-known/agent-card.json
    timeout-ms: 60000
  host:
    model:
      default-tier: strong
      tiers:
        fast:
          model-name: ${LLM_MODEL_NAME:deepseek-flash}
          api-key: ${LLM_API_KEY:}
          base-url: ${LLM_BASE_URL:https://api.deepseek.com}
        strong:
          model-name: ${LLM_MODEL_NAME:deepseek-flash}
          api-key: ${LLM_API_KEY:}
          base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      complexity:
        simple-keywords: [平均分, 最高分, 最低分, 是多少, 有多少, 数量, 总数]
        complex-keywords: [对比, 比较, 分别, 各年级, 各个, 同比, 环比, 明细, 列出, 以及, 并且, 同时]
        length-threshold: 60
    trace:
      enabled: true
      jsonl-file: .agentscope/traces/a2a-host.jsonl
      max-records: 200
      ttl-ms: 3600000
      # trace 只记录两类调用耗时：llm-call / tool-call（每行一次，带会话/层标识）
      # Delta 过滤后行量稀疏，默认逐行刷盘便于实时 tail；高并发可关换吞吐
      flush-every-line: ${A2A_TRACE_FLUSH_EVERY_LINE:true}
    confirm:
      # SQL HITL 用户确认等待超时；超时按拒绝处理，SSE 断开时挂起立即作废
      timeout-ms: ${A2A_CONFIRM_TIMEOUT_MS:300000}

embedding:
  base-url: ${EMBEDDING_BASE_URL:http://localhost:8082}
  model: ${EMBEDDING_MODEL:bge-m3}

rerank:
  base-url: ${RERANK_BASE_URL:http://localhost:8083}
  model: ${RERANK_MODEL:bge-reranker-v2-m3}

memory:
  # 会话语义快照闲置过期时间。sessionId 由前端落 localStorage 长期复用，
  # TTL 需覆盖"隔天回来继续追问"的场景
  session-ttl: 24h
  longterm:
    # 长期记忆：流水写穿 PG + 定时 LLM 压缩（摘要/画像）
    archive-enabled: true
    jobs-enabled: true
    turns-keep: 50
    summary:
      idle-minutes: 30
      scan-fixed-delay-ms: 600000
    profile:
      refresh-fixed-delay-ms: 3600000
      max-chars: 300

ai:
  # /aiChat/* 网关钥匙。本地填 application-local.yaml，生产走环境变量 AI_API_KEY，
  # 为空时启动直接报错（fail-fast），见 AiApiKeyFilter。
  api-key: ${AI_API_KEY:}

cors:
  # 逗号分隔的精确域名（allowCredentials 下不可用 *）。本地默认同源端口，
  # 生产按实填，如 https://nlp.example.com,https://admin.example.com
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8079}

logging:
  level:
    org.example.nlp2dsl2sql: debug

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:/mapper/**/*.xml

dsl:
  translator:
    dialect: postgresql
