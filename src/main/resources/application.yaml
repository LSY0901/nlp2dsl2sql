server:
  port: 8079

spring:
  application:
    name: Nlp2dsl2sql
  datasource:
    url: jdbc:postgresql://localhost:5432/agent_db?options=-c%20search_path%3Dagent%2Cpublic
    username: agent_user
    password: 123456

agentscope:
  model:
    provider: openai
  openai:
    api-key:
    base-url: https://api.deepseek.com
    model-name: deepseek-v4-flash
  a2a:
    server:
      enabled: true
      card:
        name: sql-query-agent
        description: 自然语言业务数据查询（NLP→DSL→SQL）

a2a:
  sql-agent:
    base-url: http://127.0.0.1:8079
    agent-card-path: /.well-known/agent-card.json
  sop-agent:
    base-url: http://127.0.0.1:9003
    agent-card-path: /.well-known/agent-card.json
    timeout-ms: 60000
  host:
    model:
      default-tier: strong
      tiers:
        fast:
          model-name: qwen3.7-plus
          api-key:
          base-url: https://ws-rgijbwnyj4przbh8.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        strong:
          model-name: deepseek-v4-flash-0731
          api-key:
          base-url: https://ws-rgijbwnyj4przbh8.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      complexity:
        simple-keywords: [平均分, 最高分, 最低分, 是多少, 有多少, 数量, 总数]
        complex-keywords: [对比, 比较, 分别, 各年级, 各个, 同比, 环比, 明细, 列出, 以及, 并且, 同时]
        length-threshold: 60
    trace:
      enabled: true
      jsonl-file: .agentscope/traces/a2a-host.jsonl
      max-records: 200
      ttl-ms: 3600000

embedding:
  base-url: http://localhost:8082
  model: bge-m3

rerank:
  base-url: http://localhost:8083
  model: bge-reranker-v2-m3

logging:
  level:
    org.example.nlp2dsl2sql: debug

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:/mapper/**/*.xml

dsl:
  translator:
    dialect: postgresql
